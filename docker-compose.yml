version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: welcome-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Optional: leave unauthenticated for simple local dev, or add root credentials:
      MONGO_INITDB_DATABASE: e-commerce
    volumes:
      - mongodb_data:/data/db

  # Optional web GUI to view and manage MongoDB in your browser
  mongo-express:
    image: mongo-express:latest
    container_name: welcome-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
